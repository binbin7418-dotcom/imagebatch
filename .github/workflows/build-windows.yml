name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller pillow
      - name: Build
        run: pyinstaller imagebatch.spec
      - name: Package
        run: Compress-Archive -Path dist/ImageBatch -DestinationPath ImageBatch-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImageBatch-Windows
          path: ImageBatch-Windows.zip
